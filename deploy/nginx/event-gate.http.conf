# Bootstrap HTTP vhost used only until Let's Encrypt certs exist.
server {
    listen 80;
    listen [::]:80;
    server_name broker.logikmancer.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://broker.logikmancer.com$request_uri;
    }
}
