# Event Gate — nginx front door.
# Serves the Vite SPA from client/dist and proxies /api + /ws to the Node
# process bound on 127.0.0.1:3001. Do not expose 3001 to the internet.
#
# Install: copy to /etc/nginx/sites-available/event-gate.conf
#          ln -s into sites-enabled, then nginx -t && nginx -s reload
#
# TLS (Let's Encrypt) — uncomment the ssl listen + certificate lines after:
#   certbot certonly --nginx -d YOUR_DOMAIN
# and set server_name to that domain.

upstream event_gate {
    server 127.0.0.1:3001;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/broker/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://event_gate;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /ws {
        proxy_pass http://event_gate;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 86400;
    }

    # --- TLS (enable after certbot) ---
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    # add_header Strict-Transport-Security "max-age=31536000" always;
}
