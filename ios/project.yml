name: EventGate
options:
  bundleIdPrefix: com.logikmancer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  defaultConfig: Debug
settings:
  base:
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.8.0
targets:
  EventGate:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EventGate
        excludes:
          - "**/*.example"
      - path: EventGate/GoogleService-Info.plist
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.logikmancer.mybroker
        PRODUCT_NAME: EventGate
        PRODUCT_DISPLAY_NAME: Event Gate
        INFOPLIST_FILE: EventGate/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: EventGate/EventGate.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Event Gate
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
    entitlements:
      path: EventGate/EventGate.entitlements
      properties:
        aps-environment: development
    info:
      path: EventGate/Info.plist
      properties:
        CFBundleDisplayName: Event Gate
        UIBackgroundModes: [remote-notification]
        FirebaseAppDelegateProxyEnabled: false
        UILaunchScreen: {}
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseCore
      - package: firebase-ios-sdk
        product: FirebaseMessaging
    scheme:
      testTargets: []
